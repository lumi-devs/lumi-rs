[workspace]
resolver = "2"
members = [
  "crates/db",
  "crates/kernel",
  "crates/ui",
  "crates/modules",
  "crates/api",
  "crates/lumi",
  "xtask",
]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
rust-version = "1.95"
license    = "MIT"
repository = "https://github.com/lumi-devs/lumi-rs"
publish    = false

[workspace.dependencies]
# Internal crates
lumi-db      = { path = "crates/db" }
lumi-kernel  = { path = "crates/kernel" }
lumi-ui      = { path = "crates/ui" }
lumi-modules = { path = "crates/modules" }
lumi-api     = { path = "crates/api" }

# Discord
serenity = { git = "https://github.com/serenity-rs/serenity", branch = "next", default-features = false, features = [
  "builder", "cache", "chrono", "collector", "framework",
  "gateway", "http", "model", "rustls_backend", "utils",
] }
poise = { git = "https://github.com/serenity-rs/poise", branch = "serenity-next", features = ["handle_panics"] }

# Async
tokio      = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "fs", "net", "process"] }
futures    = "0.3"

# Storage
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sea-orm = { version = "2.0", default-features = false, features = [
  "macros", "with-chrono", "with-json", "with-uuid",
  "runtime-tokio-rustls", "sqlx-postgres", "schema-sync", "entity-registry",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
  "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json", "with-uuid",
] }
redis = { version = "0.28", features = ["tokio-comp", "connection-manager", "streams"] }
moka  = { version = "0.12", features = ["future"] }

# Web / RPC
reqwest          = { version = "0.12", default-features = false, features = ["rustls-tls"] }
axum             = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower-http       = { version = "0.6", default-features = false, features = ["trace"] }
tower_governor   = { version = "0.8", default-features = false, features = ["axum"] }
governor         = "0.10"

# Git (addon repositories)
gix = { version = "0.89", default-features = false, features = [
  "blocking-network-client", "blocking-http-transport-reqwest-rust-tls",
  "blob-diff", "index", "parallel", "revision", "sha1", "worktree-mutation",
] }
gix-worktree = { version = "0.58", default-features = false, features = ["attributes"] }
gix-worktree-state = { version = "0.36", default-features = false }

# Background jobs
apalis       = "1"
apalis-redis = "1"

# Serde / errors / utils
aho-corasick = "1.1"
regex       = "1.11"
unicode-normalization = "0.1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
dotenvy     = "0.15"
anyhow      = "1"
thiserror   = "2"
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
dashmap     = "6"
once_cell   = "1"
arc-swap    = "1"
figment     = { version = "0.10", features = ["toml", "env"] }
humantime   = "2.1"
croner      = "2.1"
mimalloc    = { version = "0.1", default-features = false }

# Observability
metrics              = "0.24"
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics-exporter-prometheus = { version = "0.16", default-features = false }
sysinfo              = "0.33"

[workspace.lints.rust]
unsafe_code = "warn"
unused_crate_dependencies = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
trivial_numeric_casts = "warn"
trivial_casts = "warn"
unit_bindings = "warn"
missing_docs = "warn"
unnameable_types = "warn"
let_underscore_drop = "warn"
unused_macro_rules = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
explicit_outlives_requirements = "warn"
ambiguous_negative_literals = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_abi = "warn"

[workspace.lints.clippy]
# --- Groups (priority -1 so individual overrides below win) ---
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# --- Hard project gates ---
disallowed_methods = "deny"

# --- Restriction lints (the "bad shit" catchers) ---
unwrap_used = "warn"
expect_used = "warn"
panicking_unwrap = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
exit = "warn"
todo = "warn"
unimplemented = "warn"
try_err = "warn"
panic_in_result_fn = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
verbose_file_reads = "warn"
create_dir = "warn"
clone_on_ref_ptr = "warn"
tests_outside_test_module = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_conversions = "allow"
assertions_on_result_states = "warn"
infinite_loop = "warn"
lossy_float_literal = "warn"
string_lit_chars_any = "warn"
implicit_clone = "warn"
format_push_string = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
self_named_module_files = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
field_scoped_visibility_modifiers = "warn"
rest_pat_in_fully_bound_structs = "warn"
deref_by_slicing = "warn"
mutex_atomic = "warn"
non_zero_suggestions = "warn"
if_then_some_else_none = "warn"
cfg_not_test = "warn"
alloc_instead_of_core = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"

# --- Noisy pedantic lints to allow back ---
unused_async_trait_impl = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
map_unwrap_or = "allow"
default_trait_access = "allow"
too_many_lines = "allow"
single_match = "allow"
cognitive_complexity = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
suboptimal_flops = "allow"
useless_let_if_seq = "allow"
missing_const_for_fn = "allow"
non_send_fields_in_send_ty = "allow"
multiple_crate_versions = "allow"
indexing_slicing = "allow"
same_name_method = "allow"
cargo_common_metadata = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true
codegen-units = 1

[profile.ci]
inherits = "release"
lto      = "off"
