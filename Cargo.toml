[workspace]
resolver = "2"
members = [
  "crates/db",
  "crates/kernel",
  "crates/ui",
  "crates/script",
  "crates/modules",
  "crates/api",
  "crates/rest",
  "crates/lumi",
  "crates/lints",
  "xtask",
]

[workspace.package]
edition    = "2024"
rust-version = "1.95"
license    = "MIT"
repository = "https://github.com/lumi-devs/lumi-rs"
publish    = false

[workspace.dependencies]
# Internal crates
lumi-db      = { path = "crates/db" }
lumi-kernel  = { path = "crates/kernel" }
lumi-ui      = { path = "crates/ui" }
lumi-script  = { path = "crates/script" }
lumi-modules = { path = "crates/modules" }
lumi-api     = { path = "crates/api" }
lumi-rest    = { path = "crates/rest" }

# Discord
serenity = { git = "https://github.com/serenity-rs/serenity", branch = "next", default-features = false, features = [
  "builder", "cache", "chrono", "collector", "framework",
  "gateway", "http", "model", "rustls_backend", "utils",
] }
poise = { git = "https://github.com/serenity-rs/poise", branch = "serenity-next" }

# Async
tokio      = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "fs", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures    = "0.3"
async-trait = "0.1"

# Storage
sea-orm = { version = "2.0", default-features = false, features = [
  "macros", "with-chrono", "with-json", "with-uuid",
  "runtime-tokio-rustls", "sqlx-postgres", "schema-sync", "entity-registry",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
  "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json", "with-uuid",
] }
redis = { version = "0.28", features = ["tokio-comp", "connection-manager", "streams"] }
moka  = { version = "0.12", features = ["future"] }

# Web / RPC
axum             = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower            = "0.5"
tower-http       = { version = "0.6", default-features = false, features = ["trace"] }
tower_governor   = { version = "0.8", default-features = false, features = ["axum"] }
governor         = "0.10"

# Background jobs
apalis       = "1"
apalis-redis = "1"

# Scripting (addons)
rhai = { version = "1", features = ["sync", "serde"] }

# Serde / errors / utils
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
dotenvy     = "0.15"
anyhow      = "1"
thiserror   = "2"
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
dashmap     = "6"
once_cell   = "1"
arc-swap    = "1"

# Observability
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics              = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# Dev
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic   = { level = "warn", priority = -1 }
nursery    = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo        = "warn"
use_self                 = "allow"
return_self_not_must_use = "allow"
multiple_crate_versions  = "allow"
module_name_repetitions  = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
must_use_candidate       = "allow"
too_many_lines           = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true
codegen-units = 1

[profile.ci]
inherits = "release"
lto      = "off"
